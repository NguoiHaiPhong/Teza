[package]
name = "teza-call"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Isolated pure-Rust VoIP signaling, UDP ZRTP relay, Opus/RTP audio pipeline, and 1-1 call engine for Teza"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
getrandom = { version = "0.3", features = ["std"] }
opus-pure = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
zalo-core = { path = "../zalo-core" }

[[bin]]
name = "call_lab"
path = "src/bin/call_lab.rs"
