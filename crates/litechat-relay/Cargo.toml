[package]
name = "litechat-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight dual-protocol (SOCKS5h + HTTP CONNECT) relay proxy server for litechat intranet deployments"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
