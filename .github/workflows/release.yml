name: Release Teza

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Pre-build checks
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/desktop exec tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir apps/desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TEZA_GDRIVE_CLIENT_ID: ${{ secrets.TEZA_GDRIVE_CLIENT_ID }}
          TEZA_GDRIVE_CLIENT_SECRET: ${{ secrets.TEZA_GDRIVE_CLIENT_SECRET }}
          TEZA_GDRIVE_TOKEN_BROKER_URL: ${{ secrets.TEZA_GDRIVE_TOKEN_BROKER_URL }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: "Teza v__VERSION__"
          releaseBody: |
            Bản phát hành cài đặt Windows & gói Auto-Update cho Teza v__VERSION__.

            ### Cài đặt trên máy không có Internet (Offline / Mạng nội bộ)
            Nếu máy đích không có Internet hoặc báo thiếu thư viện khi cài/mở app, hãy tải sẵn 2 gói chính thức từ Microsoft rồi cài **trước khi** chạy bộ cài Teza:

            - **Microsoft Edge WebView2 Runtime — Evergreen Standalone (x64, ~280 MB):** [Tải trực tiếp `MicrosoftEdgeWebView2RuntimeInstallerX64.exe`](https://go.microsoft.com/fwlink/?linkid=2124701) · [Trang Microsoft WebView2](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) *(chọn **Evergreen Standalone Installer → x64**, không dùng Bootstrapper)*
            - **Microsoft Visual C++ 2015–2022 Redistributable (x64, ~24.4 MB):** [Tải trực tiếp `VC_redist.x64.exe`](https://aka.ms/vs/17/release/vc_redist.x64.exe) · [Trang Microsoft Docs](https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist)

            Xem hướng dẫn từng bước & lệnh cài tự động (Silent Install): [docs/OFFLINE_INSTALL.md](https://github.com/NguoiHaiPhong/Teza/blob/main/docs/OFFLINE_INSTALL.md)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
